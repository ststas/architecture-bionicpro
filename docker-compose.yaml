services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak_user -d keycloak_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command: 
      - start-dev
      - --import-realm
      # customer_id определяет, чей отчёт видит пользователь: запрещаем менять его самому пользователю
      - --spi-user-profile-legacy-user-profile-read-only-attributes=customer_id
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak_db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_KEYCLOAK_URL: http://localhost:8080
      REACT_APP_KEYCLOAK_REALM: reports-realm
      REACT_APP_KEYCLOAK_CLIENT_ID: reports-frontend

  # --- Задание 2: источники данных (заглушки) ---
  crm_db:
    image: postgres:14
    environment:
      POSTGRES_DB: crm_db
      POSTGRES_USER: crm_user
      POSTGRES_PASSWORD: crm_password
    volumes:
      - crm_db_data:/var/lib/postgresql/data
      - ./db/crm/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_user -d crm_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  telemetry_db:
    image: postgres:14
    environment:
      POSTGRES_DB: telemetry_db
      POSTGRES_USER: telemetry_user
      POSTGRES_PASSWORD: telemetry_password
    volumes:
      - telemetry_db_data:/var/lib/postgresql/data
      - ./db/telemetry/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry_user -d telemetry_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Задание 2: OLAP ---
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: bionicpro
      CLICKHOUSE_USER: bionicpro
      CLICKHOUSE_PASSWORD: bionicpro_password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Задание 2: Airflow (LocalExecutor) ---
  airflow_db:
    image: postgres:14
    environment:
      POSTGRES_DB: airflow_db
      POSTGRES_USER: airflow_user
      POSTGRES_PASSWORD: airflow_password
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow_user -d airflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10
  airflow-init:
    <<: &airflow-common
      build:
        context: ./airflow
      environment:
        AIRFLOW__CORE__EXECUTOR: LocalExecutor
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:airflow_password@airflow_db:5432/airflow_db
        AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
        AIRFLOW__WEBSERVER__SECRET_KEY: bionicpro-dev-secret
      volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./airflow/sql:/opt/airflow/sql
    # Миграции, пользователь admin и подключения для DAG.
    # Подключения сохраняются в базе Airflow, поэтому видны в интерфейсе: Admin -> Connections.
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com
        add_conn() {
          airflow connections delete "$$1" >/dev/null 2>&1 || true
          airflow connections add "$$@"
        }
        add_conn crm_db --conn-type postgres --conn-host crm_db --conn-port 5432 --conn-schema crm_db --conn-login crm_user --conn-password crm_password --conn-description "CRM: клиенты и протезы (источник ETL)"
        add_conn telemetry_db --conn-type postgres --conn-host telemetry_db --conn-port 5432 --conn-schema telemetry_db --conn-login telemetry_user --conn-password telemetry_password --conn-description "Телеметрия протезов (источник ETL)"
        add_conn clickhouse --conn-type http --conn-host clickhouse --conn-port 8123 --conn-schema bionicpro --conn-login bionicpro --conn-password bionicpro_password --conn-description "ClickHouse: сырые таблицы и витрина отчётов"
    depends_on:
      airflow_db:
        condition: service_healthy
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      crm_db:
        condition: service_healthy
      telemetry_db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8081:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  crm_db_data:
  telemetry_db_data:
  clickhouse_data:
  airflow_db_data:
